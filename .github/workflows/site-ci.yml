# Reusable CI for every authority site in the network.
#
# The six sites are byte-identical clones, so their CI lived as six copies of the
# same deploy.yml — every change meant six edits. This defines the pipeline once;
# each site's workflow is a thin caller (see a site's .github/workflows/deploy.yml).
#
# Note: this does NOT deploy — Netlify builds each site from its own repo. This is
# the lint + build gate. The content guard (self-closing MDC component tags) runs
# inside `pnpm build` via the rig-nuxt module hook, so it needs no separate step.
name: Site CI

on:
  workflow_call:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Prettier drift shipped twice while the gate ran `lint` only. Prettier is
      # scoped to source by each site's .prettierignore (content/data excluded).
      - name: Format check
        run: pnpm format:check

      # Spin-tell lint. The 5.1 editorial pass cleaned ~160 thesaurus
      # substitutions and unsubstantiated testing claims out of the articles by
      # hand; this gate stops the next generated batch reintroducing them.
      #
      # The wordlist is inline here rather than fetched from a shared file: the
      # default GITHUB_TOKEN in a site's run can't read the private org .github
      # repo (the same PAT gap that blocks the products-db parity check). Since
      # this reusable workflow IS the one definition all six sites call, editing
      # the list here still propagates fleet-wide in a single edit.
      #
      # Whole-word, case-insensitive, over content/articles only.
      - name: Spin-tell lint
        run: |
          tells='dwelling|residence|abode|numerous|seamless|seamlessly|boasts|utilize|utilizes|utilizing|myriad|plethora|delve into|in my testing|our testing|hands-on testing|hands-on evaluation|grab dialed in|raised-end|lofty effort|the sole best value proposition'
          if grep -rniE "\\b(${tells})\\b" content/articles --include='*.md'; then
            echo ""
            echo "✗ spin-tells found above — thesaurus-substituted or padded prose."
            echo "  Rewrite them, or if genuinely correct, drop the tell from the"
            echo "  list in .github/workflows/site-ci.yml with a note."
            exit 1
          fi
          echo "✓ no spin-tells in content/articles"

      # Layer-drift guard. rig-nuxt ships shared pages and components, and a
      # project file at the same path silently wins over the layer's copy — no
      # warning, no error. That silence is how each site kept its own copy of
      # pages the layer already provided, long after the extraction was done:
      # the copies were found in August 2026, two months stale.
      #
      # Overriding a layer file is legitimate and supported. Keeping a copy that
      # is identical to it is not — that is duplication with no override in it.
      - name: Layer drift guard
        run: |
          node --input-type=module -e '
          import { readFileSync, existsSync, readdirSync, statSync } from "node:fs"
          import { join, relative } from "node:path"
          const layer = "node_modules/@amulet-laboratories/rig-nuxt/layer"
          if (!existsSync(layer)) {
            console.log("no rig-nuxt layer installed — nothing to compare")
            process.exit(0)
          }
          const walk = (d) => readdirSync(d).flatMap((f) => {
            const p = join(d, f)
            return statSync(p).isDirectory() ? walk(p) : [p]
          })
          const norm = (p) => readFileSync(p, "utf8").replace(/\s+/g, " ").trim()
          const dupes = walk(layer)
            .filter((f) => !f.endsWith("nuxt.config.ts"))
            .map((f) => relative(layer, f))
            .filter((rel) => existsSync(rel) && norm(rel) === norm(join(layer, rel)))
          if (dupes.length) {
            console.error("✗ these project files are identical to the rig-nuxt layer copy:")
            for (const d of dupes) console.error("    " + d)
            console.error("")
            console.error("  Delete them — the layer already provides them. Keep a file at a")
            console.error("  layer path only when it actually differs from what the layer ships.")
            process.exit(1)
          }
          console.log("✓ no redundant copies of layer files")
          '

      # Restores the gate deleted by accident in 2e2b39a (2026-07-23), which
      # added the spin-tell lint and dropped `pnpm build` in the same diff. The
      # header above kept describing a build gate that had not run since. The
      # MDC content guard runs inside the build via the rig-nuxt module hook, so
      # it went eleven days without executing either.
      - name: Build
        run: pnpm build
